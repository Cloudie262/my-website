<!DOCTYPE html>
<html>
    <head>
        <title>Form Example2</title>
    </head>
    <body>
        <form>
            <h1>Student Information</h1>
            First Name:<input type="text" name="first" id="first">
            <br><br>
            Second Name:<input type="text" name="second" id="second">
            <br><br>
            Password:<input type="password" name="password">
            <br><br>
            <div>
            <input type="radio" name="tsuki" id="tsuki" value="Male">
            <label for="tsuki">Male</label>
            <br><br>
             <input type="radio" name="simon" id="simon" value="Female">
            <label for="simon">Female</label>
            <br><br>
             <input type="radio" name="other" id="other" value="Other">
            <label for="Other">Other</label>
            <br><br>
            </div>
            <div>
            <input type="checkbox" name="check" id="check" value="I have a pen">
            <label for="check">I have a pen</label>
            <br><br>
             <input type="checkbox" name="check1" id="check1" value="I have a textbook">
            <label for="check1">I have a text book</label>
            <br><br>
             <input type="checkbox" name="check2" id="check2" value="I have an e-book">
            <label for="check2">I have an e-book</label>
            <br><br>
            </div>
        </form>
    </body>
</html>
