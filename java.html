<!DOCTYPE html>
<html lang="en">
    <head>
        <title>12 times table</title>
    </head>
    <body>
        <script type="text/javascript">
            for (var i = 1; i <= 12; i++) {
                document.write("12 * " + i + " = " + 12 * i + "<br>");
            }
        </script>"
    </body>
</html>
