<!DOCTYPE html>
<html>
    <head>
        <title>UIT Timetable</title>
    </head>
    <body>
        <table border="1" bgcolor="white" 
         width="50%" cellpadding="5" cellspacing="2">
        <tr>
            <th id="Day" rowspan="3" bgcolor="teal">Day</th>
            <th id="Classes" colspan="4" bgcolor="teal">Classes</th>
        </tr>
        <tr>
            <th id="Schedule" colspan="2" bgcolor="lightblue">Schedule</th>
            <th id="Topic" rowspan="2" bgcolor="lightblue">Topic</th>
        </tr>
        <tr>
            <th id="From" bgcolor="skyblue">From</th>
            <th id="To" bgcolor="skyblue">To</th>
        </tr>
        <tr>
            <th id="Monday" rowspan="2" bgcolor="lightblue">Monday</th>
            <td headers="Monday From" rowspan="2" bgcolor="lightblue">8:00am</td>
            <td headers="Monday To" rowspan="2" bgcolor="lightblue">10:00pm</td>
            <td headers="Monday Topic" bgcolor="lightblue">HTML</td>
        </tr>
        <tr>
            <td headers="Monday Topic" bgcolor="skyblue">CSS</td>
        </tr>
        <tr>
            <th id="Tuesday" rowspan="3" bgcolor="lightblue">Tuesday</th>
            <td headers="Tuesday From" bgcolor="lightblue">8:00am</td>
            <td headers="Tuesday To" bgcolor="lightblue">9:00am</td>
            <td headers="Tuesday Topic" bgcolor="lightblue">Myanmar</td>
        </tr> 
        <tr>
            <td headers="Tuesday From" bgcolor="skyblue">9:00am</td>
            <td headers="Tuesday To" bgcolor="skyblue">9:30am</td>
            <td headers="Tuesday Topic" rowspan="2" bgcolor="skyblue">English</td>
        </tr>
        <tr>
            <td headers="Tuesday From" bgcolor="lightblue">9:40am</td>
            <td headers="Tuesday To" bgcolor="lightblue">10:00am</td>
        </tr>
        <tr>
            <th id="Wednesday" bgcolor="skyblue">Wednesday</th>
            <td headers="Wednesday From" bgcolor="skyblue">8:00am</td>
            <td headers="Wednesday To" bgcolor="skyblue">10:00am</td>
            <td headers="Wednesday Topic" bgcolor="skyblue">Maths</td>
        </tr>
        </table>
    </body>
</html>
