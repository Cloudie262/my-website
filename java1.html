<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Simple Calculator</title>
    </head>
    <body>
        <h1>Calculator</h1>
        <label for="1st">First Number</label>
        <input type="text" name="first" id="first">

        <label for="2nd">Second Number</label>
        <input type="text" name="second" id="second">
        <br><br>
        <label for="operation">Operation</label>
        <select name="operation" id="operation">
        <option value="add">Add</option>  
        <option value="substract">Substract</option>
        <option value="multiply">Multiply</option>
        <option value="divide">Divide</option>
        </select>
        <br><br>
        <button type="button" onclick="display()" name="cal" id="cal">Calculate</button>
        <p id="result"></p>
        <script>
            function display() {
                let operation = document.getElementById("operation").value;
                let firstnum = Number(document.getElementById("first").value);
                let secnum = Number(document.getElementById("second").value);
                let answer;
                switch (operation) {
                    case "add":
                        answer = firstnum + secnum;
                        break;
                    case "substract":
                        answer = firstnum - secnum;
                        break;
                    case "multiply":
                        answer = firstnum * secnum;
                        break;
                    case "divide":
                       answer = firstnum / secnum;
                        break;
                }
            document.getElementById("result").innerHTML = "Answer = " + answer;
            }
        </script>
    </body>
</html>
