<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Unorder List</title>
    </head>
    <body>
        <ul>
            <li>A</li>
            <li>B</li>
            <li>C</li>
        </ul>
        <ul type="circle">
            <li>A</li>
            <li>B</li>
            <li>C</li>
        </ul>
        <ol type="1" start="5">
            <li>1</li>
            <li>2</li>
            <li>3</li>
        </ol>
        <ol type="I" start="5">
            <li>1</li>
            <li>2</li>
            <li>3</li>
        </ol>

       
    </body>
</html>
